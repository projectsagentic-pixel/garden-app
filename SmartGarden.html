<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Gloria+Hallelujah&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --ink: #1f1d1a; --ink-soft: #4a463f; --ink-faint: #8a8378;
  --paper: #fbf8f1; --paper-2: #f4efe3; --line: #2a2722;
  --green: #6a8a3a; --green-soft: #c9d8a8;
  --terra: #b8623a; --terra-soft: #e8c5ae;
  --sky: #7ba8c4; --sky-soft: #c8dde7;
  --yellow: #e8c547; --yellow-soft: #f5e6a8;
  --purple: #8a6fa3; --purple-soft: #d6c7e0;
  --pen: 'Caveat', cursive; --hand: 'Kalam', cursive;
  --label: 'Patrick Hand', cursive; --note: 'Gloria Hallelujah', cursive;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;background:var(--paper);color:var(--ink);font-family:var(--hand)}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;border-right:1.6px solid var(--line);background:var(--paper-2);padding:20px 14px;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main{flex:1;overflow-y:auto;padding:28px 32px}
.nav-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1.4px solid transparent;border-radius:4px;cursor:pointer;font-family:var(--label);font-size:15px;color:var(--ink-soft)}
.nav-item:hover{background:var(--paper)}
.nav-item.active{background:var(--paper);border-color:var(--line);color:var(--ink)}
.bed-cell{cursor:pointer;transition:opacity .15s}.bed-cell:hover{opacity:.8}
.palette-item{display:flex;align-items:center;gap:4px;padding:4px 8px;border:1.2px solid var(--line);font-family:var(--label);font-size:12px;cursor:pointer}
.palette-item.sel{border-width:2px;border-color:var(--terra)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:3px}
select,input,textarea{font-family:var(--note);font-size:14px;background:var(--paper);border:1.4px solid var(--line);outline:none;border-radius:0;color:var(--ink)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useId } = React;

/* ── DATA ── */
const PLANTS_DATA = [
  {id:'tomato', name:'Tomate cherry', family:'Solanáceas', difficulty:2, sun:'pleno', water:3, companions:['herb','flower','lettuce'], avoid:['bean'], sow:[2,3,4], plant:[3,4,5], harvest:[6,7,8,9]},
  {id:'pepper', name:'Pimiento italiano', family:'Solanáceas', difficulty:2, sun:'pleno', water:2, companions:['herb','carrot'], avoid:['bean'], sow:[1,2,3], plant:[3,4,5], harvest:[6,7,8,9]},
  {id:'lettuce', name:'Lechuga maravilla', family:'Compuestas', difficulty:1, sun:'medio', water:3, companions:['carrot','onion','tomato'], avoid:[], sow:[1,2,3,8,9], plant:[2,3,9,10], harvest:[3,4,5,10,11]},
  {id:'carrot', name:'Zanahoria nantesa', family:'Umbelíferas', difficulty:1, sun:'pleno', water:2, companions:['lettuce','onion'], avoid:[], sow:[1,2,3,7,8], plant:[], harvest:[4,5,6,10,11]},
  {id:'onion', name:'Cebolla morada', family:'Liliáceas', difficulty:2, sun:'pleno', water:1, companions:['carrot','lettuce'], avoid:['bean'], sow:[0,1,8,9], plant:[2,3,10], harvest:[5,6,7]},
  {id:'bean', name:'Judía verde', family:'Leguminosas', difficulty:1, sun:'pleno', water:2, companions:['carrot','lettuce'], avoid:['tomato','pepper','onion'], sow:[3,4,5], plant:[4,5,6], harvest:[6,7,8]},
  {id:'herb', name:'Albahaca', family:'Labiadas', difficulty:1, sun:'pleno', water:3, companions:['tomato','pepper'], avoid:[], sow:[2,3,4], plant:[4,5], harvest:[5,6,7,8,9]},
  {id:'flower', name:'Caléndula', family:'Compuestas', difficulty:1, sun:'medio', water:2, companions:['tomato','pepper','lettuce'], avoid:[], sow:[2,3,8], plant:[3,4], harvest:[4,5,6,7,8,9]},
];
const getPlant = id => PLANTS_DATA.find(p => p.id === id);
const BED_COLORS = ['var(--green-soft)','var(--terra-soft)','var(--yellow-soft)','var(--purple-soft)','var(--sky-soft)'];
const cellColor = id => ({'tomato':'rgba(184,98,58,.18)','pepper':'rgba(232,197,71,.22)','lettuce':'rgba(106,138,58,.22)','carrot':'rgba(184,98,58,.14)','herb':'rgba(106,138,58,.18)','onion':'rgba(214,199,224,.4)','flower':'rgba(232,197,71,.3)','bean':'rgba(106,138,58,.18)'}[id]||'var(--paper)');
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const KIND_COLORS = {siembra:'var(--green-soft)',plantar:'var(--green-soft)',riego:'var(--sky-soft)',cosecha:'var(--yellow-soft)',plaga:'var(--terra-soft)',poda:'var(--paper-2)',foto:'var(--paper-2)',nota:'var(--paper-2)'};
const ENTRY_KINDS = ['siembra','plantar','riego','cosecha','plaga','poda','foto','nota'];

const DEFAULT_BEDS = [
  {id:'b1',name:'Bancal Norte',w:4,h:3,colorIdx:0,cells:[
    {x:0,y:0,plantId:'tomato',date:'12 abr'},{x:1,y:0,plantId:'tomato',date:'12 abr'},
    {x:2,y:0,plantId:'pepper',date:'12 abr'},{x:3,y:0,plantId:'pepper',date:'12 abr'},
    {x:0,y:1,plantId:'lettuce',date:'5 abr'},{x:1,y:1,plantId:'lettuce',date:'5 abr'},
    {x:2,y:1,plantId:'herb',date:'5 abr'},
    {x:0,y:2,plantId:'carrot',date:'20 mar'},{x:1,y:2,plantId:'carrot',date:'20 mar'},
    {x:2,y:2,plantId:'onion',date:'15 mar'},{x:3,y:2,plantId:'flower',date:'5 abr'},
  ]},
  {id:'b2',name:'El Cuadrado',w:3,h:3,colorIdx:1,cells:[
    {x:0,y:0,plantId:'lettuce',date:'1 abr'},{x:1,y:0,plantId:'lettuce',date:'1 abr'},
    {x:0,y:1,plantId:'carrot',date:'15 mar'},{x:1,y:1,plantId:'carrot',date:'15 mar'},
  ]},
  {id:'b3',name:'Hierbas',w:5,h:2,colorIdx:2,cells:[
    {x:0,y:0,plantId:'herb',date:'10 abr'},{x:1,y:0,plantId:'herb',date:'10 abr'},
    {x:2,y:0,plantId:'flower',date:'10 abr'},{x:3,y:0,plantId:'flower',date:'10 abr'},
  ]},
  {id:'b4',name:'Bancal Largo',w:6,h:2,colorIdx:3,cells:[
    {x:0,y:0,plantId:'onion',date:'1 mar'},{x:1,y:0,plantId:'onion',date:'1 mar'},
    {x:2,y:0,plantId:'bean',date:'15 abr'},{x:3,y:0,plantId:'bean',date:'15 abr'},
    {x:0,y:1,plantId:'lettuce',date:'5 abr'},
  ]},
  {id:'b5',name:'Junto al Muro',w:3,h:2,colorIdx:4,cells:[
    {x:0,y:0,plantId:'tomato',date:'20 abr'},{x:1,y:0,plantId:'pepper',date:'20 abr'},
  ]},
];
const DEFAULT_DIARY = [
  {id:'d1',date:'30 abr',bedId:'b1',kind:'cosecha',text:'Primeras lechugas! 4 cabezas, ~1.2 kg',plantId:'lettuce'},
  {id:'d2',date:'28 abr',bedId:'b1',kind:'riego',text:'Regado profundo, suelo seco arriba',plantId:''},
  {id:'d3',date:'25 abr',bedId:'b2',kind:'plaga',text:'Pulgón en pimiento — neem aplicado',plantId:'pepper'},
  {id:'d4',date:'22 abr',bedId:'b3',kind:'siembra',text:'Sembrada albahaca y perejil',plantId:'herb'},
  {id:'d5',date:'20 abr',bedId:'b1',kind:'foto',text:'Tomates con primeras flores 🌼',plantId:'tomato'},
  {id:'d6',date:'15 abr',bedId:'b4',kind:'siembra',text:'Judías directo a tierra, 2 filas',plantId:'bean'},
  {id:'d7',date:'12 abr',bedId:'b1',kind:'plantar',text:'Plantón de tomate cherry × 2',plantId:'tomato'},
];

/* ── STORAGE ── */
function useStore() {
  const [beds, setBeds] = useState(() => { try { const r=localStorage.getItem('sg_beds'); return r?JSON.parse(r):DEFAULT_BEDS; } catch{ return DEFAULT_BEDS; }});
  const [diary, setDiary] = useState(() => { try { const r=localStorage.getItem('sg_diary'); return r?JSON.parse(r):DEFAULT_DIARY; } catch{ return DEFAULT_DIARY; }});
  useEffect(()=>{ localStorage.setItem('sg_beds', JSON.stringify(beds)); },[beds]);
  useEffect(()=>{ localStorage.setItem('sg_diary', JSON.stringify(diary)); },[diary]);
  const addBed = useCallback(b => setBeds(p=>[...p,b]),[]);
  const updateBed = useCallback(b => setBeds(p=>p.map(x=>x.id===b.id?b:x)),[]);
  const addEntry = useCallback(e => setDiary(p=>[e,...p]),[]);
  return {beds,diary,addBed,updateBed,addEntry};
}

/* ── SKETCHY PRIMITIVES ── */
function seeded(seed){let s=(seed|0)||1;return()=>{s=(s*1664525+1013904223)|0;return((s>>>0)%10000)/10000;}}
function roughRect(x,y,w,h,seed=7,jitter=1.2){const r=seeded(seed);const j=()=>(r()-.5)*jitter*2;const p1=[x+j(),y+j()],p2=[x+w+j(),y+j()],p3=[x+w+j(),y+h+j()],p4=[x+j(),y+h+j()];return `M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} L ${p3[0]} ${p3[1]} L ${p4[0]} ${p4[1]} Z`;}

function RoughBox({width,height,fill='transparent',stroke,strokeWidth=1.6,seed=7,jitter=1.2,children,style,dashed,double:dbl,onClick}){
  const w=typeof width==='number'?width:300, h=typeof height==='number'?height:100;
  return (
    <div onClick={onClick} style={{position:'relative',width,height,cursor:onClick?'pointer':undefined,...style}}>
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{position:'absolute',inset:0,pointerEvents:'none',overflow:'visible'}}>
        {fill!=='transparent'&&<path d={roughRect(2,2,w-4,h-4,seed,jitter*.6)} fill={fill} stroke="none"/>}
        <path d={roughRect(2,2,w-4,h-4,seed,jitter)} fill="none" stroke={stroke||'var(--line)'} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" strokeDasharray={dashed?'5 4':undefined}/>
        {dbl&&<path d={roughRect(4,4,w-8,h-8,seed+11,jitter*.7)} fill="none" stroke={stroke||'var(--line)'} strokeWidth={strokeWidth*.7} strokeLinecap="round" strokeLinejoin="round" opacity={0.6}/>}
      </svg>
      <div style={{position:'relative',width:'100%',height:'100%'}}>{children}</div>
    </div>
  );
}

function SketchButton({children,width=110,height=32,fill='var(--paper)',seed=5,onClick,style}){
  const w=typeof width==='number'?width:110;
  return (
    <div onClick={onClick} style={{position:'relative',width,height,display:'inline-flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontFamily:'var(--label)',fontSize:15,color:'var(--ink)',...style}}>
      <svg width={w} height={height} viewBox={`0 0 ${w} ${height}`} style={{position:'absolute',inset:0,overflow:'visible'}}>
        <path d={roughRect(3,3,w-6,height-6,seed,1)} fill={fill} stroke="var(--line)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      <span style={{position:'relative',padding:'0 10px'}}>{children}</span>
    </div>
  );
}

function ScribbleTitle({children,size=28,color='var(--ink)',accent='var(--terra)'}){
  return (
    <div style={{display:'inline-block',position:'relative'}}>
      <div style={{fontFamily:'var(--pen)',fontSize:size,lineHeight:1.1,color,fontWeight:600}}>{children}</div>
      <svg width="100%" height="8" viewBox="0 0 200 8" preserveAspectRatio="none" style={{display:'block',marginTop:-2}}>
        <path d="M2 4 Q40 1 80 4 T160 4 T198 5" stroke={accent} strokeWidth="2.2" fill="none" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

function Squiggle({w=80,color='var(--terra)',strokeWidth=2.2}){
  return <svg width={w} height={6} viewBox={`0 0 ${w} 6`} preserveAspectRatio="none"><path d={`M2 3 Q ${w*.25} 1 ${w*.5} 3 T ${w-2} 3`} stroke={color} strokeWidth={strokeWidth} fill="none" strokeLinecap="round"/></svg>;
}

function PlantGlyph({kind='leaf',size=18,color='var(--line)'}){
  const s=size;
  const sk={stroke:color,strokeWidth:1.4,fill:'none',strokeLinecap:'round',strokeLinejoin:'round'};
  switch(kind){
    case 'tomato':   return <svg width={s} height={s} viewBox="0 0 24 24"><circle cx="12" cy="14" r="7" {...sk} fill="rgba(184,98,58,.35)"/><path d="M8 7 L12 10 L16 7 M12 10 L12 7" {...sk}/></svg>;
    case 'lettuce':  return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 16 Q4 10 9 8 Q12 4 15 8 Q20 10 19 16 Z" {...sk} fill="rgba(106,138,58,.25)"/><path d="M9 14 Q12 10 15 14 M12 8 L12 16" {...sk}/></svg>;
    case 'carrot':   return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M12 8 L8 20 L12 22 L16 20 Z" {...sk} fill="rgba(184,98,58,.4)"/><path d="M9 8 Q10 4 12 5 Q14 4 15 8" {...sk}/></svg>;
    case 'pepper':   return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M10 8 Q8 14 11 19 Q14 20 15 16 Q17 12 14 8 Z" {...sk} fill="rgba(232,197,71,.35)"/><path d="M11 8 Q12 5 14 6" {...sk}/></svg>;
    case 'onion':    return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M7 15 Q7 9 12 9 Q17 9 17 15 Q17 20 12 20 Q7 20 7 15 Z" {...sk} fill="rgba(214,199,224,.4)"/><path d="M10 5 L12 9 L14 5 M12 9 L12 19" {...sk}/></svg>;
    case 'bean':     return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M6 18 Q4 12 10 6 M10 6 Q14 8 13 13 M13 13 Q12 18 6 18" {...sk} fill="rgba(106,138,58,.25)"/></svg>;
    case 'flower':   return <svg width={s} height={s} viewBox="0 0 24 24"><circle cx="12" cy="10" r="2.5" {...sk}/><circle cx="12" cy="6" r="2" {...sk} fill="rgba(232,197,71,.5)"/><circle cx="8" cy="9" r="2" {...sk} fill="rgba(232,197,71,.5)"/><circle cx="16" cy="9" r="2" {...sk} fill="rgba(232,197,71,.5)"/><circle cx="9" cy="13" r="2" {...sk} fill="rgba(232,197,71,.5)"/><circle cx="15" cy="13" r="2" {...sk} fill="rgba(232,197,71,.5)"/><path d="M12 14 L12 22" {...sk}/></svg>;
    case 'herb':     return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M12 22 L12 8" {...sk}/><path d="M12 16 Q8 14 7 10 Q11 11 12 14 M12 12 Q16 10 17 6 Q13 7 12 10" {...sk} fill="rgba(106,138,58,.25)"/></svg>;
    default:         return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 19 Q5 8 18 5 Q20 14 9 19 Z" {...sk} fill="rgba(106,138,58,.3)"/><path d="M9 17 Q12 12 17 7" {...sk}/></svg>;
  }
}

function Icon({kind,size=22,color='var(--line)'}){
  const s=size;
  const sk={stroke:color,strokeWidth:1.5,fill:'none',strokeLinecap:'round',strokeLinejoin:'round'};
  switch(kind){
    case 'plus':     return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M12 5 L12 19 M5 12 L19 12" {...sk}/></svg>;
    case 'search':   return <svg width={s} height={s} viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" {...sk}/><path d="M16 16 L20 20" {...sk}/></svg>;
    case 'calendar': return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 7 L19 7 L19 19 L5 19 Z M5 11 L19 11 M9 5 L9 9 M15 5 L15 9" {...sk}/></svg>;
    case 'home':     return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M4 12 L12 5 L20 12 M6 11 L6 20 L18 20 L18 11" {...sk}/></svg>;
    case 'book':     return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 5 L11 6 L11 19 L5 18 Z M11 6 L17 5 L19 6 L19 18 L17 19 L11 19" {...sk}/></svg>;
    case 'leaf':     return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 19 Q5 8 18 5 Q20 14 9 19 Z" {...sk} fill="rgba(106,138,58,.3)"/><path d="M9 17 Q12 12 17 7" {...sk}/></svg>;
    case 'sun':      return <svg width={s} height={s} viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" {...sk}/><path d="M12 3 L12 5 M12 19 L12 21 M3 12 L5 12 M19 12 L21 12 M5.5 5.5 L7 7 M17 17 L18.5 18.5 M5.5 18.5 L7 17 M17 7 L18.5 5.5" {...sk}/></svg>;
    case 'drop':     return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M12 4 Q6 12 6 16 Q6 20 12 20 Q18 20 18 16 Q18 12 12 4 Z" {...sk}/></svg>;
    case 'camera':   return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 9 L9 9 L11 7 L13 7 L15 9 L19 9 L19 18 L5 18 Z" {...sk}/><circle cx="12" cy="13.5" r="3" {...sk}/></svg>;
    case 'pencil':   return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 19 L7 14 L16 5 L19 8 L10 17 Z M14 7 L17 10" {...sk}/></svg>;
    case 'trash':    return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 7 L19 7 M9 7 L9 5 L15 5 L15 7 M7 7 L8 19 L16 19 L17 7 M11 11 L11 16 M13 11 L13 16" {...sk}/></svg>;
    case 'check':    return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 13 L10 18 L19 7" {...sk}/></svg>;
    case 'arrow-r':  return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M5 12 L19 12 M14 7 L19 12 L14 17" {...sk}/></svg>;
    case 'arrow-l':  return <svg width={s} height={s} viewBox="0 0 24 24"><path d="M19 12 L5 12 M10 7 L5 12 L10 17" {...sk}/></svg>;
    default:         return <svg width={s} height={s} viewBox="0 0 24 24"/>;
  }
}

function PlantTag({name,color='var(--green-soft)',icon}){
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,background:color,padding:'3px 8px',fontFamily:'var(--label)',fontSize:14,borderRadius:2,border:'1.2px solid var(--line)',whiteSpace:'nowrap'}}>{icon&&<PlantGlyph kind={icon} size={18}/>}{name}</span>;
}

/* ── OVERVIEW ── */
function Overview({beds,onSelectBed,onNewBed}){
  const total = beds.reduce((s,b)=>s+b.cells.length,0);
  return (
    <div>
      <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:24}}>
        <div>
          <ScribbleTitle size={30}>Mi huerto</ScribbleTitle>
          <div style={{fontFamily:'var(--note)',fontSize:13,color:'var(--ink-soft)',marginTop:8}}>{beds.length} bancales · {total} plantas</div>
        </div>
        <SketchButton fill="var(--green-soft)" width={140} onClick={onNewBed}>+ nuevo bancal</SketchButton>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:16}}>
        {beds.map((b,i)=><BedTile key={b.id} bed={b} idx={i} onClick={()=>onSelectBed(b.id)}/>)}
        <div style={{cursor:'pointer'}} onClick={onNewBed}>
          <RoughBox width={220} height={170} fill="transparent" dashed seed={99}>
            <div style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,color:'var(--ink-faint)'}}>
              <Icon kind="plus" size={28} color="var(--ink-faint)"/>
              <span style={{fontFamily:'var(--label)',fontSize:14}}>añadir bancal</span>
            </div>
          </RoughBox>
        </div>
      </div>
    </div>
  );
}

function BedTile({bed,idx,onClick}){
  const fill=BED_COLORS[bed.colorIdx%BED_COLORS.length];
  const unique=[...new Set(bed.cells.map(c=>c.plantId))];
  const pct=Math.round((bed.cells.length/(bed.w*bed.h))*100);
  return (
    <RoughBox width={220} height={170} fill="var(--paper)" seed={idx*17+3} jitter={1.1} onClick={onClick}>
      <div style={{padding:'12px 14px',height:'100%',display:'flex',flexDirection:'column'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
          <div style={{fontFamily:'var(--pen)',fontSize:19,fontWeight:600,lineHeight:1}}>{bed.name}</div>
          <div style={{fontFamily:'var(--label)',fontSize:11,color:'var(--ink-faint)'}}>{bed.w}×{bed.h}</div>
        </div>
        <div style={{marginTop:10,display:'flex',alignItems:'center',justifyContent:'center',flex:1}}>
          <div style={{display:'grid',gridTemplateColumns:`repeat(${bed.w},1fr)`,width:Math.min(bed.w*16,160),height:Math.min(bed.h*16,80),background:fill,padding:2,border:'1.2px solid var(--line)',gap:1}}>
            {Array.from({length:bed.w*bed.h}).map((_,i)=>{
              const x=i%bed.w,y=Math.floor(i/bed.w);
              const cell=bed.cells.find(c=>c.x===x&&c.y===y);
              return <div key={i} style={{background:cell?'rgba(31,29,26,.45)':'rgba(255,255,255,.3)',borderRadius:1}}/>;
            })}
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8}}>
          <div style={{display:'flex',gap:3}}>{unique.slice(0,4).map(p=><PlantGlyph key={p} kind={p} size={16}/>)}</div>
          <span style={{fontFamily:'var(--label)',fontSize:11,color:'var(--ink-faint)'}}>{pct}% lleno</span>
        </div>
      </div>

/* ── BED EDITOR ── */
const CELL=64;
function BedEditor({bed:init,onSave,onBack}){
  const [bed,setBed]=useState(init);
  const [selPlant,setSelPlant]=useState(null);
  const [selCell,setSelCell]=useState(null);
  const [editing,setEditing]=useState(false);
  const [name,setName]=useState(init.name);
  const findCell=(x,y)=>bed.cells.find(c=>c.x===x&&c.y===y);

  const clickCell=(x,y)=>{
    if(!editing){setSelCell({x,y});return;}
    if(!selPlant)return;
    const ex=findCell(x,y);
    if(ex) setBed(p=>({...p,cells:p.cells.filter(c=>!(c.x===x&&c.y===y))}));
    else setBed(p=>({...p,cells:[...p.cells,{x,y,plantId:selPlant,date:new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'})}]}));
  };
  const removeCell=(x,y)=>{setBed(p=>({...p,cells:p.cells.filter(c=>!(c.x===x&&c.y===y))}));setSelCell(null);};
  const save=()=>{onSave({...bed,name});setEditing(false);};
  const popCell=selCell?findCell(selCell.x,selCell.y):null;
  const popPlant=popCell?getPlant(popCell.plantId):null;
  const uniquePlants=[...new Set(bed.cells.map(c=>c.plantId))];

  return (
    <div style={{display:'flex',height:'100%',gap:0}}>
      <div style={{width:196,borderRight:'1.6px solid var(--line)',background:'var(--paper-2)',padding:'16px 14px',flexShrink:0}}>
        <div style={{fontFamily:'var(--pen)',fontSize:18,fontWeight:600}}>plantar</div>
        <Squiggle w={60}/>
        <div style={{marginTop:12,fontFamily:'var(--label)',fontSize:11,color:'var(--ink-faint)',textTransform:'uppercase',letterSpacing:.5}}>de temporada</div>
        <div style={{marginTop:8,display:'flex',flexWrap:'wrap',gap:5}}>
          {PLANTS_DATA.map(p=>(
            <div key={p.id} className={`palette-item${editing&&selPlant===p.id?' sel':''}`}
              style={{background:cellColor(p.id),opacity:editing?1:.55}}
              onClick={()=>editing&&setSelPlant(p.id)}>
              <PlantGlyph kind={p.id} size={15}/><span>{p.name.split(' ')[0]}</span>
            </div>
          ))}
        </div>
        <div style={{marginTop:16,fontFamily:'var(--label)',fontSize:11,color:'var(--ink-faint)',textTransform:'uppercase',letterSpacing:.5}}>herramientas</div>
        <div onClick={()=>editing&&selCell&&removeCell(selCell.x,selCell.y)}
          style={{marginTop:8,display:'flex',alignItems:'center',gap:8,padding:'4px 6px',cursor:'pointer',fontFamily:'var(--label)',fontSize:13,color:'var(--ink-soft)'}}>
          <Icon kind="trash" size={16} color="var(--ink-soft)"/>quitar planta
        </div>
        {editing&&<div style={{marginTop:14,fontFamily:'var(--note)',fontSize:11,color:'var(--ink-soft)',lineHeight:1.5}}>selecciona planta → clic en celda</div>}
      </div>

      <div style={{flex:1,padding:'22px 28px',overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:20}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div onClick={onBack} style={{cursor:'pointer'}}><Icon kind="arrow-l" size={22} color="var(--ink-soft)"/></div>
            <div>
              {editing
                ? <input value={name} onChange={e=>setName(e.target.value)} style={{fontFamily:'var(--pen)',fontSize:26,fontWeight:600,background:'transparent',border:'none',borderBottom:'1.5px solid var(--terra)',outline:'none',color:'var(--ink)',width:240}}/>
                : <ScribbleTitle size={26}>{bed.name}</ScribbleTitle>
              }
              <div style={{fontFamily:'var(--note)',fontSize:12,color:'var(--ink-soft)',marginTop:4}}>{editing?'editando':`${bed.w}×${bed.h} · ${bed.cells.length} plantas`}</div>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            {editing
              ? <><SketchButton width={90} fill="var(--paper)" onClick={()=>{setEditing(false);setBed(init);setName(init.name);}}>cancelar</SketchButton>
                  <SketchButton width={90} fill="var(--green-soft)" onClick={save}>guardar</SketchButton></>
              : <SketchButton width={100} fill="var(--paper)" onClick={()=>setEditing(true)}><Icon kind="pencil" size={16} color="var(--ink-soft)"/>&nbsp;editar</SketchButton>
            }
          </div>
        </div>

        <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
          <div style={{position:'relative'}}>
            <RoughBox width={bed.w*CELL+26} height={bed.h*CELL+26} fill={BED_COLORS[bed.colorIdx%BED_COLORS.length]} seed={9} jitter={1.6} double>
              <div style={{padding:13,display:'grid',gridTemplateColumns:`repeat(${bed.w},${CELL}px)`,gridTemplateRows:`repeat(${bed.h},${CELL}px)`,gap:3}}>
                {Array.from({length:bed.w*bed.h}).map((_,i)=>{
                  const x=i%bed.w,y=Math.floor(i/bed.w);
                  const cell=findCell(x,y);
                  const sel=selCell?.x===x&&selCell?.y===y;
                  return (
                    <div key={i} className="bed-cell" onClick={()=>clickCell(x,y)}>
                      <RoughBox width={CELL} height={CELL} fill={cell?cellColor(cell.plantId):'var(--paper)'} seed={i*13+1} jitter={.9} stroke={sel?'var(--terra)':undefined} strokeWidth={sel?2.2:1.6}>
                        <div style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3}}>
                          {cell?<><PlantGlyph kind={cell.plantId} size={30}/><div style={{fontFamily:'var(--label)',fontSize:10,textAlign:'center'}}>{getPlant(cell.plantId)?.name.split(' ')[0]}</div></>
                               :(editing?<Icon kind="plus" size={16} color="var(--ink-faint)"/>:null)}
                        </div>
                      </RoughBox>
                    </div>
                  );
                })}
              </div>
            </RoughBox>
            <div style={{marginTop:8,fontFamily:'var(--note)',fontSize:11,color:'var(--ink-faint)',textAlign:'center'}}>↕ {(bed.h*.4).toFixed(1)} m · ↔ {(bed.w*.4).toFixed(1)} m</div>
          </div>

          {selCell&&popCell&&popPlant&&(
            <RoughBox width={200} height={140} fill="var(--paper)" seed={42} jitter={1.2} style={{alignSelf:'flex-start',transform:'rotate(1.5deg)',marginTop:8}}>
              <div style={{padding:14}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}><PlantGlyph kind={popPlant.id} size={24}/><div style={{fontFamily:'var(--pen)',fontSize:17,fontWeight:600}}>{popPlant.name}</div></div>
                <div style={{fontFamily:'var(--note)',fontSize:12,color:'var(--ink-soft)',marginTop:8,lineHeight:1.5}}>
                  plantada {popCell.date}<br/>riego: {'•'.repeat(popPlant.water)}<br/>sol: {popPlant.sun}
                </div>
                {editing&&<div onClick={()=>removeCell(selCell.x,selCell.y)} style={{marginTop:8,fontFamily:'var(--label)',fontSize:12,color:'var(--terra)',cursor:'pointer'}}>× quitar</div>}
              </div>
            </RoughBox>
          )}
        </div>

        <div style={{marginTop:24,maxWidth:500}}>
          <div style={{fontFamily:'var(--pen)',fontSize:18,fontWeight:600,marginBottom:8}}>Plantado</div>
          <Squiggle w={80}/>
          <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:6}}>
            {uniquePlants.map(pid=>{
              const count=bed.cells.filter(c=>c.plantId===pid).length;
              const p=getPlant(pid); if(!p)return null;
              const d=bed.cells.find(c=>c.plantId===pid)?.date||'';
              return <div key={pid} style={{display:'flex',alignItems:'center',gap:10,fontFamily:'var(--note)',fontSize:13}}>
                <PlantGlyph kind={p.id} size={20}/>
                <div style={{flex:1}}>{p.name}</div>
                <span style={{color:'var(--ink-faint)'}}>×{count}</span>
                <span style={{color:'var(--ink-faint)',width:55,textAlign:'right'}}>{d}</span>
              </div>;
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function CalMonth({month,onMonth}){
  const sow=PLANTS_DATA.filter(p=>p.sow.includes(month));
  const plant=PLANTS_DATA.filter(p=>p.plant.includes(month));
  const harvest=PLANTS_DATA.filter(p=>p.harvest.includes(month));
  const Section=({title,plants,color})=>plants.length===0?null:(
    <div style={{marginBottom:20}}>
      <div style={{fontFamily:'var(--pen)',fontSize:19,fontWeight:600,marginBottom:8}}>{title}</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {plants.map(p=><div key={p.id} style={{display:'inline-flex',alignItems:'center',gap:8,background:color,padding:'6px 12px',border:'1.2px solid var(--line)',fontFamily:'var(--label)',fontSize:14}}><PlantGlyph kind={p.id} size={20}/>{p.name}</div>)}
      </div>
    </div>
  );
  return (
    <div style={{maxWidth:540}}>
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:20}}>
        <div onClick={()=>onMonth((month-1+12)%12)} style={{cursor:'pointer'}}><Icon kind="arrow-l" size={22} color="var(--ink-soft)"/></div>
        <div style={{fontFamily:'var(--pen)',fontSize:24,fontWeight:700,flex:1,textAlign:'center'}}>{MONTH_NAMES[month]}</div>
        <div onClick={()=>onMonth((month+1)%12)} style={{cursor:'pointer'}}><Icon kind="arrow-r" size={22} color="var(--ink-soft)"/></div>
      </div>
      <Section title="sembrar ahora" plants={sow} color="var(--green-soft)"/>
      <Section title="trasplantar" plants={plant} color="var(--terra-soft)"/>
      <Section title="cosechar" plants={harvest} color="var(--yellow-soft)"/>
    </div>
  );
}

        ))}
      </div>
    </div>

            {[['sun','sol',p.sun],['drop','riego','•'.repeat(p.water)],['leaf','dificultad',['fácil','media','difícil'][p.difficulty-1]]].map(([icon,label,value])=>(
              <RoughBox key={label} width={100} height={64} fill="var(--paper-2)" seed={label.length*5} jitter={1}>
                <div style={{padding:'8px 10px'}}><Icon kind={icon} size={18}/><div style={{fontFamily:'var(--label)',fontSize:10,color:'var(--ink-faint)',textTransform:'uppercase',marginTop:2}}>{label}</div><div style={{fontFamily:'var(--note)',fontSize:13,fontWeight:600}}>{value}</div></div>
              </RoughBox>
            ))}
          </div>
        </div>
      </div>
      <div style={{marginTop:24}}>
        <div style={{fontFamily:'var(--pen)',fontSize:18,fontWeight:600,marginBottom:10}}>cuándo plantar</div>
        <RoughBox width={440} height={60} fill="var(--paper-2)" seed={9} jitter={1.1}>
          <div style={{padding:'8px 12px'}}>
            <div style={{display:'flex',fontFamily:'var(--label)',fontSize:10,color:'var(--ink-faint)',textTransform:'uppercase'}}>
              {ms.map((m,i)=><div key={i} style={{flex:1,textAlign:'center',fontWeight:i===3?700:400,color:i===3?'var(--terra)':undefined}}>{m}</div>)}
            </div>
            <div style={{display:'flex',gap:1,marginTop:4}}>
              {Array.from({length:12}).map((_,i)=>(
                <div key={i} style={{flex:1,height:18,background:p.harvest.includes(i)?'var(--yellow-soft)':p.sow.includes(i)||p.plant.includes(i)?'var(--green-soft)':'transparent',border:'1px solid rgba(0,0,0,.12)'}}/>
              ))}
            </div>
          </div>
        </RoughBox>
      </div>
      <div style={{marginTop:20}}>
        <div style={{fontFamily:'var(--pen)',fontSize:18,fontWeight:600,marginBottom:8}}>se lleva bien con</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {p.companions.map(c=>{const cp=getPlant(c);return cp?<PlantTag key={c} icon={cp.id} name={cp.name} color="var(--green-soft)"/>:null;})}
        </div>
        {p.avoid.length>0&&<>
          <div style={{fontFamily:'var(--pen)',fontSize:14,fontWeight:600,color:'var(--terra)',marginTop:10,marginBottom:6}}>evita junto a</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{p.avoid.map(c=>{const cp=getPlant(c);return cp?<PlantTag key={c} icon={cp.id} name={cp.name} color="var(--terra-soft)"/>:null;})}</div>
        </>}
      </div>
    </div>
  );
}

/* ── NEW BED MODAL ── */
function NewBedModal({onSave,onCancel}){
  const [name,setName]=useState('');
  const [w,setW]=useState(4);
  const [h,setH]=useState(3);
  const [colorIdx,setColorIdx]=useState(0);
  const save=()=>{if(!name.trim())return;onSave({id:`b${Date.now()}`,name:name.trim(),w,h,colorIdx,cells:[]});};
  const Num=({val,set,min,max,lbl})=>(
    <div style={{display:'flex',alignItems:'center',gap:6}}>
      <div onClick={()=>set(Math.max(min,val-1))} style={{width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',border:'1.2px solid var(--line)',cursor:'pointer',fontFamily:'var(--pen)',fontSize:18}}>−</div>
      <div style={{fontFamily:'var(--pen)',fontSize:20,fontWeight:600,width:24,textAlign:'center'}}>{val}</div>
      <div onClick={()=>set(Math.min(max,val+1))} style={{width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',border:'1.2px solid var(--line)',cursor:'pointer',fontFamily:'var(--pen)',fontSize:18}}>+</div>
      <span style={{fontFamily:'var(--label)',fontSize:12,color:'var(--ink-faint)'}}>{lbl}</span>
    </div>
  );
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(31,29,26,.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}}>
      <div style={{background:'var(--paper)',border:'1.6px solid var(--line)',padding:'28px 32px',maxWidth:420,width:'100%'}}>
        <div style={{fontFamily:'var(--pen)',fontSize:24,fontWeight:600,marginBottom:20}}>nuevo bancal</div>
        <div style={{fontFamily:'var(--label)',fontSize:11,color:'var(--ink-faint)',textTransform:'uppercase',marginBottom:6}}>nombre</div>
        <input value={name} onChange={e=>setName(e.target.value)} autoFocus placeholder="ej: Bancal Sur" style={{width:'100%',marginBottom:16,padding:'8px 12px',fontSize:15}}/>
        <div style={{fontFamily:'var(--label)',fontSize:11,color:'var(--ink-faint)',textTransform:'uppercase',marginBottom:8}}>tamaño</div>
        <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:16}}>
          <Num val={w} set={setW} min={1} max={10} lbl="ancho"/>
          <span style={{fontFamily:'var(--pen)',fontSize:20}}>×</span>
          <Num val={h} set={setH} min={1} max={8} lbl="alto"/>
          <div style={{fontFamily:'var(--note)',fontSize:13,color:'var(--ink-soft)'}}>{w*h} celdas</div>
        </div>
        <div style={{display:'flex',justifyContent:'center',marginBottom:16}}>
          <div style={{display:'grid',gridTemplateColumns:`repeat(${w},20px)`,gap:2,background:BED_COLORS[colorIdx],padding:4,border:'1.2px solid var(--line)'}}>
            {Array.from({length:w*h}).map((_,i)=><div key={i} style={{width:20,height:20,background:'rgba(255,255,255,.4)'}}/>)}
          </div>
        </div>
        <div style={{fontFamily:'var(--label)',fontSize:11,color:'var(--ink-faint)',textTransform:'uppercase',marginBottom:8}}>color</div>
        <div style={{display:'flex',gap:8,marginBottom:20}}>
          {BED_COLORS.map((c,i)=><div key={i} onClick={()=>setColorIdx(i)} style={{width:32,height:32,background:c,border:`${colorIdx===i?2.5:1.4}px solid ${colorIdx===i?'var(--terra)':'var(--line)'}`,cursor:'pointer',borderRadius:2}}/>)}
        </div>
        <div style={{display:'flex',gap:8}}>
          <SketchButton fill="var(--green-soft)" width={130} onClick={save}>crear bancal</SketchButton>
          <SketchButton fill="var(--paper)" width={90} onClick={onCancel}>cancelar</SketchButton>
        </div>
      </div>
    </div>
  );
}

/* ── APP ── */
const NAV=[{s:'overview',icon:'home',l:'huerto'},{s:'calendar',icon:'calendar',l:'cuándo'},{s:'catalog',icon:'leaf',l:'plantas'},{s:'history',icon:'book',l:'diario'}];

function App(){
  const {beds,diary,addBed,updateBed,addEntry}=useStore();
  const [screen,setScreen]=useState('overview');
  const [bedId,setBedId]=useState(null);
  const [plantId,setPlantId]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const go=s=>{setScreen(s);setBedId(null);setPlantId(null);};
  const activeBed=beds.find(b=>b.id===bedId);

  return (
    <div className="app">
      <aside className="sidebar">
        <div style={{marginBottom:4}}>
          <div style={{fontFamily:'var(--pen)',fontSize:22,fontWeight:700}}>Smart</div>
          <div style={{fontFamily:'var(--pen)',fontSize:22,fontWeight:700,color:'var(--green)',lineHeight:.9}}>Garden</div>
        </div>
        <Squiggle w={70}/>
        <nav style={{marginTop:24,display:'flex',flexDirection:'column',gap:8}}>
          {NAV.map(n=>(
            <div key={n.s} className={`nav-item${screen===n.s||(n.s==='overview'&&screen==='bed')?' active':''}`} onClick={()=>go(n.s)}>
              <Icon kind={n.icon} size={18} color={screen===n.s?'var(--terra)':'var(--ink-soft)'}/>
              <span>{n.l}</span>
            </div>
          ))}
        </nav>
        <div style={{marginTop:'auto',fontFamily:'var(--note)',fontSize:12,color:'var(--ink-faint)',paddingTop:16}}>📍 Madrid · zona 9</div>
      </aside>
      <main className="main">
        {screen==='overview'&&<Overview beds={beds} onSelectBed={id=>{setBedId(id);setScreen('bed');}} onNewBed={()=>setShowNew(true)}/>}
        {screen==='bed'&&activeBed&&<BedEditor bed={activeBed} onSave={b=>updateBed(b)} onBack={()=>go('overview')}/>}
        {screen==='calendar'&&<Calendar/>}
        {screen==='history'&&<History entries={diary} beds={beds} onAdd={addEntry}/>}
        {screen==='catalog'&&<Catalog onSelectPlant={id=>{setPlantId(id);setScreen('plant-detail');}}/>}
        {screen==='plant-detail'&&plantId&&<PlantDetail plantId={plantId} onBack={()=>go('catalog')}/>}
      </main>
      {showNew&&<NewBedModal onSave={b=>{addBed(b);setShowNew(false);setBedId(b.id);setScreen('bed');}} onCancel={()=>setShowNew(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
